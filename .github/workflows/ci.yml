name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p fw-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Conformance and end-to-end suites against the release binary
        shell: bash
        run: |
          bin="$PWD/target/release/4w"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$PWD/target/release/4w.exe"; fi
          FOURWORDS_TEST_BIN="$bin" bun test tests/mcp.test.ts tests/update.test.ts tests/tui.test.ts tests/watch.test.ts tests/room-tui.test.ts

  legacy-typescript:
    name: TypeScript reference suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun test

  audit:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories bans licenses
